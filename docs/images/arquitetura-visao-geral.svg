<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F5F7A"/>
    </marker>
    <style>
      .card   { fill: #FFFFFF; stroke: #2A9D8F; stroke-width: 4; }
      .tcard  { font-size: 25px; font-weight: 700; fill: #2A9D8F; }
      .rot    { font-size: 19px; font-weight: 600; fill: #1E293B; }
      .rotS   { font-size: 17px; font-weight: 600; fill: #1E293B; }
      .fio    { stroke: #1F5F7A; stroke-width: 4; fill: none; marker-end: url(#seta); }
      .camada { stroke: #FFFFFF; stroke-width: 2; }
    </style>
    <!-- ícone "camadas" (pilha de 3 losangos), reaproveitado nos cards -->
    <g id="camadas">
      <path d="M0,40 L36,22 L72,40 L36,58 z" fill="#E8553E" class="camada"/>
      <path d="M0,26 L36,8 L72,26 L36,44 z" fill="#EF6C4E" class="camada"/>
      <path d="M0,12 L36,-6 L72,12 L36,30 z" fill="#F4846A" class="camada"/>
    </g>
  </defs>

  <rect width="1600" height="780" fill="#FFFFFF"/>

  <!-- faixa de título -->
  <rect x="0" y="0" width="1600" height="92" fill="#2A9D8F"/>
  <text x="800" y="60" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">Arquitetura do Agente de IA no Databricks</text>

  <!-- ================= FONTES ================= -->
  <!-- pilha de PDFs -->
  <g transform="translate(48,195)">
    <rect x="22" y="0" width="74" height="92" rx="6" fill="#FBD5CF" stroke="#E8553E" stroke-width="2"/>
    <rect x="11" y="9" width="74" height="92" rx="6" fill="#FCE3DF" stroke="#E8553E" stroke-width="2"/>
    <path d="M0,18 h56 l18,18 v74 h-74 z" fill="#FFFFFF" stroke="#E8553E" stroke-width="2.5"/>
    <path d="M56,18 v18 h18" fill="#FCE3DF" stroke="#E8553E" stroke-width="2.5"/>
    <rect x="-6" y="52" width="50" height="24" rx="4" fill="#E8553E"/>
    <text x="19" y="70" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">PDF</text>
    <line x1="12" y1="88" x2="60" y2="88" stroke="#F4A99B" stroke-width="3"/>
    <line x1="12" y1="98" x2="50" y2="98" stroke="#F4A99B" stroke-width="3"/>
  </g>
  <text x="105" y="345" class="rot" text-anchor="middle">509 PDFs</text>
  <text x="105" y="368" font-size="15" fill="#475569" text-anchor="middle">manuais de produto</text>

  <!-- tabelas (planilhas) -->
  <g transform="translate(34,520)">
    <g>
      <rect x="0" y="0" width="44" height="52" rx="5" fill="#E7F7EC" stroke="#22A55B" stroke-width="2.5"/>
      <path d="M0,17 h44 M0,34 h44 M15,0 v52 M30,0 v52" stroke="#22A55B" stroke-width="2"/>
    </g>
    <g transform="translate(48,0)">
      <rect x="0" y="0" width="44" height="52" rx="5" fill="#E6F0FD" stroke="#3B82F6" stroke-width="2.5"/>
      <path d="M0,17 h44 M0,34 h44 M15,0 v52 M30,0 v52" stroke="#3B82F6" stroke-width="2"/>
    </g>
    <g transform="translate(96,0)">
      <rect x="0" y="0" width="44" height="52" rx="5" fill="#F1E9FD" stroke="#8B5CF6" stroke-width="2.5"/>
      <path d="M0,17 h44 M0,34 h44 M15,0 v52 M30,0 v52" stroke="#8B5CF6" stroke-width="2"/>
    </g>
  </g>
  <rect x="58" y="588" width="94" height="28" rx="14" fill="#7C3AED"/>
  <text x="105" y="608" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">TABELAS</text>
  <text x="105" y="642" font-size="15" fill="#475569" text-anchor="middle">políticas, clientes, produtos</text>

  <path d="M190,252 L246,252" class="fio"/>
  <path d="M190,560 L246,560" class="fio"/>

  <!-- ================= BASE NÃO ESTRUTURADA ================= -->
  <rect x="250" y="140" width="580" height="250" rx="30" class="card"/>

  <!-- chunks: blocos empilhados -->
  <g transform="translate(300,180)">
    <g fill="#9ED8C9" stroke="#2A9D8F" stroke-width="2">
      <path d="M0,40 l26,-13 l26,13 l-26,13 z"/><path d="M0,40 v30 l26,13 v-30 z" fill="#7CC8B4"/><path d="M52,40 v30 l-26,13 v-30 z" fill="#5FB7A0"/>
      <path d="M40,22 l26,-13 l26,13 l-26,13 z"/><path d="M40,22 v30 l26,13 v-30 z" fill="#7CC8B4"/><path d="M92,22 v30 l-26,13 v-30 z" fill="#5FB7A0"/>
      <path d="M44,62 l26,-13 l26,13 l-26,13 z"/><path d="M44,62 v30 l26,13 v-30 z" fill="#7CC8B4"/><path d="M96,62 v30 l-26,13 v-30 z" fill="#5FB7A0"/>
    </g>
  </g>
  <text x="348" y="318" class="rot" text-anchor="middle">Texto + contexto</text>
  <text x="348" y="341" font-size="15" fill="#475569" text-anchor="middle">um documento por produto</text>

  <!-- embeddings: chip -->
  <g transform="translate(497,185)">
    <rect x="12" y="12" width="76" height="76" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    <g stroke="#1E293B" stroke-width="3">
      <path d="M30,0 v12 M50,0 v12 M70,0 v12 M30,88 v12 M50,88 v12 M70,88 v12"/>
      <path d="M0,30 h12 M0,50 h12 M0,70 h12 M88,30 h12 M88,50 h12 M88,70 h12"/>
    </g>
    <text x="50" y="60" font-size="22" font-weight="700" fill="#2A9D8F" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <text x="547" y="318" class="rot" text-anchor="middle">Embeddings</text>
  <text x="547" y="341" font-size="15" fill="#475569" text-anchor="middle">texto vira vetor</text>

  <!-- vector search index: camadas + nuvem de pontos -->
  <g transform="translate(672,180)">
    <use href="#camadas" transform="translate(0,14) scale(0.75)"/>
    <rect x="40" y="18" width="78" height="78" rx="10" fill="#F0FDF9" stroke="#2A9D8F" stroke-width="2"/>
    <path d="M48,88 L110,88 M48,88 L48,26 M48,88 L86,62" stroke="#94A3B8" stroke-width="1.5"/>
    <g fill="#2A9D8F">
      <circle cx="62" cy="40" r="4"/><circle cx="80" cy="34" r="3.5"/><circle cx="96" cy="48" r="4"/>
      <circle cx="70" cy="58" r="3.5"/><circle cx="90" cy="70" r="4"/><circle cx="104" cy="32" r="3"/>
    </g>
    <g fill="#8B5CF6">
      <circle cx="58" cy="72" r="3.5"/><circle cx="76" cy="78" r="3"/><circle cx="100" cy="80" r="3.5"/>
    </g>
    <g fill="#F59E0B"><circle cx="86" cy="50" r="3.5"/><circle cx="64" cy="28" r="3"/></g>
  </g>
  <text x="742" y="318" class="rot" text-anchor="middle">Vector Search</text>
  <text x="742" y="341" font-size="15" fill="#475569" text-anchor="middle">busca por significado</text>

  <path d="M410,238 L478,238" class="fio" style="stroke-width:3"/>
  <path d="M606,238 L664,238" class="fio" style="stroke-width:3"/>

  <text x="540" y="378" class="tcard" text-anchor="middle">Base não estruturada</text>

  <!-- ================= BASE ESTRUTURADA ================= -->
  <rect x="250" y="470" width="580" height="200" rx="30" class="card"/>
  <g transform="translate(310,520)">
    <use href="#camadas"/>
  </g>
  <!-- triângulo (Delta) -->
  <g transform="translate(400,505)">
    <path d="M30,4 L58,70 L2,70 z" fill="none" stroke="#2A9D8F" stroke-width="7" stroke-linejoin="round"/>
    <path d="M30,30 L44,62 L16,62 z" fill="#2A9D8F" opacity=".35"/>
  </g>
  <text x="480" y="548" font-size="28" font-weight="700" fill="#1E293B">Tabelas Delta</text>
  <text x="480" y="578" font-size="17" fill="#475569">+ funções SQL no Unity Catalog</text>
  <text x="540" y="652" class="tcard" text-anchor="middle">Base estruturada</text>

  <!-- ================= AGENTE ================= -->
  <rect x="930" y="300" width="240" height="210" rx="30" class="card"/>
  <g transform="translate(965,330)">
    <use href="#camadas" transform="translate(0,26) scale(0.85)"/>
  </g>
  <!-- robô -->
  <g transform="translate(1050,322)">
    <line x1="40" y1="0" x2="40" y2="14" stroke="#1E293B" stroke-width="3"/>
    <circle cx="40" cy="0" r="5" fill="#2A9D8F"/>
    <rect x="12" y="14" width="56" height="42" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    <circle cx="29" cy="35" r="6" fill="#2A9D8F"/><circle cx="51" cy="35" r="6" fill="#2A9D8F"/>
    <rect x="4" y="28" width="8" height="16" rx="3" fill="#1E293B"/><rect x="68" y="28" width="8" height="16" rx="3" fill="#1E293B"/>
    <rect x="16" y="60" width="48" height="44" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
    <rect x="26" y="70" width="28" height="22" rx="4" fill="#2A9D8F"/>
    <text x="40" y="87" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">AI</text>
  </g>
  <text x="1050" y="470" class="tcard" text-anchor="middle">Agente de IA</text>
  <text x="1050" y="494" font-size="15" fill="#475569" text-anchor="middle">LLM escolhe a ferramenta</text>

  <!-- bases → agente -->
  <path d="M830,240 L1050,240 L1050,294" class="fio"/>
  <text x="850" y="226" class="rot">Vector Search</text>
  <path d="M830,580 L1050,580 L1050,516" class="fio"/>
  <text x="850" y="612" class="rot">UC Functions</text>

  <!-- ================= APP ================= -->
  <rect x="1270" y="250" width="200" height="310" rx="30" class="card"/>
  <text x="1370" y="300" class="tcard" text-anchor="middle">Databricks</text>
  <text x="1370" y="330" class="tcard" text-anchor="middle">App</text>
  <g transform="translate(1340,350)">
    <use href="#camadas" transform="scale(0.85)"/>
  </g>
  <!-- monitor com balões de chat -->
  <g transform="translate(1318,420)">
    <rect x="0" y="0" width="104" height="72" rx="6" fill="#1F5F7A"/>
    <rect x="7" y="7" width="90" height="58" rx="3" fill="#E0F2FE"/>
    <rect x="16" y="15" width="48" height="16" rx="8" fill="#FFFFFF" stroke="#1F5F7A" stroke-width="1.5"/>
    <rect x="40" y="38" width="48" height="16" rx="8" fill="#2A9D8F"/>
    <rect x="44" y="72" width="16" height="12" fill="#1F5F7A"/>
    <rect x="30" y="84" width="44" height="6" rx="3" fill="#1F5F7A"/>
  </g>

  <!-- agente → app -->
  <path d="M1170,405 L1264,405" class="fio"/>
  <text x="1217" y="336" class="rotS" text-anchor="middle">Model</text>
  <text x="1217" y="358" class="rotS" text-anchor="middle">Serving</text>
  <text x="1217" y="380" class="rotS" text-anchor="middle">Endpoint</text>

  <!-- ================= USUÁRIO ================= -->
  <path d="M1470,405 L1508,405" class="fio"/>
  <g transform="translate(1516,350)">
    <circle cx="36" cy="26" r="20" fill="#FDE2C8" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M16,24 Q36,-2 56,24 Q46,12 36,14 Q26,12 16,24 z" fill="#1E293B"/>
    <path d="M4,100 Q4,56 36,54 Q68,56 68,100 z" fill="#1F5F7A" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M30,56 L36,72 L42,56" fill="#FFFFFF"/>
  </g>
  <text x="1552" y="478" class="rot" text-anchor="middle">Usuário</text>

  <!-- rodapé -->
  <text x="40" y="745" font-size="15" fill="#64748B">github.com/Gabrielxdev/E2E-Agentic-</text>
  <text x="1560" y="745" font-size="15" fill="#64748B" text-anchor="end">Inspirado no curso de Agentic AI da DataBeli</text>
</svg>
